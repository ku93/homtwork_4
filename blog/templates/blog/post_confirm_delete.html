{% extends 'catalog/base.html' %}
{% load static %}
{% block title %} Удаление {% endblock %}
{% block content %}
<div class="container h-100 d-flex align-items-center justify-content-center">
    <div class="row w-50">
        <div class="col-12">
            <form class="row" method="post" enctype="multipart/form-data">
                <div class="card">
                    <div class="card-header text-center">
                        <h5 class="card-title mt-2" style="min-height: 40px;">Вы действительно хотите удалить {{object.title}}?</h5>
                    </div>
                    <div class="card-body d-flex flex-column justify-content-between">
                        {% csrf_token %}
                    </div>
                    <div class="mt-auto">
                        <a class="btn btn-primary" href="{% url 'blog:post_detail' object.pk %}" role="button">Отмена</a>
                        <button type="submit" class="btn btn-danger">Удалить</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
