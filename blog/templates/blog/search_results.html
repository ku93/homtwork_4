{% extends 'blog/base.html' %}

{% block content %}

<h1>Результаты поиска</h1>

{% if results %}
    <ul>
    {% for post in results %}
        <li><a href="{% url 'blog:post_detail' post.pk %}">{{ post.title }}</a></li>
    {% endfor %}
    </ul>
{% else %}
    <p>По вашему запросу ничего не найдено.</p>
{% endif %}

{% endblock %}
